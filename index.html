<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mecânica Reis</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f35 100%);
            position: relative;
            overflow: hidden;
        }

        /* Decorative background elements */
        .login-page::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .login-page::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -50px;
            right: -50px;
            border-radius: 50%;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header h1 span {
            color: var(--accent-primary);
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .role-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.3rem;
            border-radius: 10px;
        }

        .role-btn {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            font-weight: 500;
        }

        .role-btn.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body class="login-page">

    <div class="login-container glass">
        <div class="login-header">
            <h1>Mecânica <span>Reis</span></h1>
            <p>Sistema de Gestão de Estoque e Serviços</p>
        </div>

        <div class="role-selector">
            <button class="role-btn active" id="btn-funcionario">Funcionário</button>
            <button class="role-btn" id="btn-cliente">Cliente</button>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2" onclick="login(event)">
                Entrar no Sistema
            </button>
        </form>

        <p class="text-center mt-4 text-secondary" style="font-size: 0.85rem; color: var(--text-secondary);">
            Esqueceu sua senha? <a href="#" style="color: var(--accent-primary); text-decoration: none;">Recuperar</a>
        </p>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Interação simples de aba na tela de login
        const btnFunc = document.getElementById('btn-funcionario');
        const btnCliente = document.getElementById('btn-cliente');

        btnFunc.addEventListener('click', () => {
            btnFunc.classList.add('active');
            btnCliente.classList.remove('active');
        });

        btnCliente.addEventListener('click', () => {
            btnCliente.classList.add('active');
            btnFunc.classList.remove('active');
        });

        function login(event) {
            event.preventDefault();
            
            // Simulação de login: Verifica qual perfil está selecionado
            if (btnFunc.classList.contains('active')) {
                // Se for funcionário, vai para o painel de gestão
                window.location.href = 'pages/dashboard.html';
            } else {
                // Se for cliente, vai para a página restrita do cliente
                window.location.href = 'pages/cliente-servicos.html';
            }
        }
    </script>
</body>
</html>
